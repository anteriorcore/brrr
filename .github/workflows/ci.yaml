on:
  push:

name: CI
jobs:
  nocommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: "nocommit checker"
        uses: nobssoftware/nocommit@5c3cf9519fe40b80b0954d254085b67b532a5dc3

  nix-flake-check:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342
        with:
          enable_kvm: true
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm"
      # Feel free to substitute in a fork
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
        if: |
          ! (github.triggering_actor == 'dependabot[bot]' && github.repository_owner == 'anteriorcore')
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - run: |
          nix profile install github:anteriorcore/tools/ba480909a9b3cf9c7e763fa604428d251c114789#nix-flake-check-changed
      - run: |
          nix-flake-check-changed

  # Ensure nix flake show isn’t broken
  nix-flake-show:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: nixbuild/nix-quick-install-action@5022709dfbaea01a71db614fb2e2a4b04168141b
      # No need for a cache
      - run: nix flake show
